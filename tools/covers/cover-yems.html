<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    position: relative;
    display: flex; align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    background: linear-gradient(135deg, #1d4d3b, #0c241b);
  }

  .copy { position: relative; z-index: 3; margin-left: 92px; width: 580px; color: #eef6f1; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(127,209,168,.4); border-radius: 999px;
    padding: 8px 18px; font-size: 20px; color: #8fd6b4; font-weight: 400;
  }
  .pill::before { content:""; width: 8px; height: 8px; border-radius: 50%; background: #34d399; }
  h1 { font-family: "Songti TC", "Noto Serif TC", serif; font-weight: 400; font-size: 66px; line-height: 1.2; margin-top: 28px; letter-spacing: 1px; }
  h1 .gold { color: #7fd1a8; }
  h1 .cream { color: #f3ecdd; }
  .sub { margin-top: 24px; font-size: 24px; line-height: 1.55; color: #c2d3cb; font-weight: 400; }
  .badges { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 13px; max-width: 540px; }
  .badge {
    border: 1px solid rgba(120,150,140,.42); border-radius: 999px;
    padding: 10px 18px; font-size: 19px; color: #d6e7df;
  }

  /* ===== MacBook Pro ===== */
  .mac { position: absolute; z-index: 1; right: 36px; top: 158px; width: 880px; }
  .screen {
    position: relative; width: 760px; margin: 0 auto;
    background: #050506; border-radius: 16px 16px 6px 6px;
    padding: 13px 12px 0;
    box-shadow:
      0 40px 90px -30px rgba(0,0,0,.7),
      0 0 0 2px #bcc2c9, 0 0 0 3px #888e95,
      inset 0 0 0 1px rgba(255,255,255,.08);
  }
  /* 螢幕玻璃反光 */
  .screen::after {
    content: ""; position: absolute; top: 13px; left: 12px; right: 12px; height: 430px;
    border-radius: 4px; pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.04) 15%, transparent 35%);
  }
  .screen .chin {
    height: 32px; display: flex; align-items: center; justify-content: center;
  }
  .screen .chin span {
    font-size: 14px; letter-spacing: 1.3px; font-weight: 400; color: #7c8188;
    text-shadow: 0 1px 0 rgba(255,255,255,.12), 0 -1px 0 rgba(0,0,0,.5);
  }
  .screen > img {
    display: block; width: 100%; height: 430px; object-fit: cover; object-position: top;
    border-radius: 4px;
  }
  /* 底座 / 鉸鏈 */
  .base {
    width: 880px; height: 20px; margin: 0 auto;
    background: linear-gradient(#dfe3e8 0%, #b9bec6 45%, #898f98 100%);
    border-radius: 3px 3px 11px 11px; position: relative;
    box-shadow: 0 26px 40px -22px rgba(0,0,0,.6);
  }
  .base::before {
    content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 132px; height: 10px; background: #7f858d; border-radius: 0 0 10px 10px;
  }

  /* ===== iPhone ===== */
  .phone {
    position: absolute; z-index: 2; right: 96px; top: 392px;
    width: 198px; height: 406px; background: #15161a; border-radius: 44px;
    padding: 9px; border: 1px solid #34363c;
    box-shadow: 0 36px 72px -22px rgba(0,0,0,.75), inset 0 0 0 2px rgba(255,255,255,.05);
  }
  .phone .ss { position: relative; width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #fff; }
  .phone .ss img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .phone .island {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 66px; height: 20px; background: #000; border-radius: 20px; z-index: 3;
  }
  /* 側鍵 */
  .phone .b { position: absolute; background: #2a2c31; border-radius: 3px; }
  .phone .pwr { right: -3px; top: 108px; width: 3px; height: 58px; }
  .phone .vu  { left: -3px; top: 96px; width: 3px; height: 34px; }
  .phone .vd  { left: -3px; top: 138px; width: 3px; height: 34px; }
  .phone .mute{ left: -3px; top: 60px; width: 3px; height: 22px; }
</style>
</head>
<body>
  <div class="copy">
    <span class="pill">內部營運系統 · Laravel</span>
    <h1><span class="gold">補習班</span><br><span class="cream">行政管理系統</span></h1>
    <div class="sub">9 大後台模組 + 家長 Portal<br>報名點數帳戶 · 刷卡扣點 · 並發一致性</div>
    <div class="badges"><span class="badge">Laravel 13</span><span class="badge">PHP 8.4</span><span class="badge">Blade</span><span class="badge">Tailwind CSS</span><span class="badge">PostgreSQL</span></div>
  </div>

  <div class="mac">
    <div class="screen">
      <img src="../../public/projects/yems-php/dashboard.png" alt="">
      <div class="chin"><span>MacBook Pro</span></div>
    </div>
    <div class="base"></div>
  </div>

  <div class="phone">
    <span class="b pwr"></span><span class="b vu"></span><span class="b vd"></span><span class="b mute"></span>
    <div class="ss">
      <div class="island"></div>
      <img src="../../public/projects/yems-php/portal-student.png" alt="">
    </div>
  </div>
</body>
</html>
